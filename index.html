<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===================== GREETING SECTION ===================== -->
    <header class="greeting-section">
      <!-- Theme toggle button — top-right corner of the header -->
      <button id="theme-toggle-btn" title="Toggle light/dark mode">🌙 Dark Mode</button>

      <h1 id="greeting-text">Good morning, Friend!</h1>
      <p id="current-date">Monday, 1 January 2025</p>
      <p id="current-time">00:00:00 AM</p>
    </header>
    <!-- ============================================================ -->

    <!-- =================== NAME INPUT FORM ======================= -->
    <!-- This small form lets the user save their name once.        -->
    <!-- It sits just below the greeting header.                    -->
    <div class="name-form">
      <input
        type="text"
        id="name-input"
        placeholder="Enter your name…"
        maxlength="30"
      />
      <button id="save-name-btn">Save Name</button>
    </div>
    <!-- ============================================================ -->

    <!-- page-wrapper centers and constrains the section cards -->
    <div class="page-wrapper">

      <!-- ==================== TO-DO LIST SECTION ================== -->
      <section class="todo-section">
        <h2 class="section-title">To-Do List</h2>

        <!-- Input row: text field + Add Task button -->
        <div class="todo-input-row">
          <input
            type="text"
            id="task-input"
            placeholder="Add a new task…"
            maxlength="100"
          />
          <button id="add-task-btn">+ Add Task</button>
        </div>

        <!-- The list where task items will appear.
             JavaScript (Task 7) will build and insert each <li> here. -->
        <ul id="task-list"></ul>
      </section>
      <!-- ============================================================ -->

      <!-- ==================== FOCUS TIMER SECTION ================= -->
      <section class="timer-section">
        <h2 class="section-title">Focus Timer</h2>

        <!-- The big countdown display -->
        <div id="timer-display">25:00</div>

        <!-- Three control buttons -->
        <div class="timer-controls">
          <button id="timer-start-btn">▶ Start</button>
          <button id="timer-stop-btn">⏸ Stop</button>
          <button id="timer-reset-btn">↺ Reset</button>
        </div>
      </section>
      <!-- ============================================================ -->

      <!-- =================== QUICK LINKS SECTION ================== -->
      <section class="links-section">
        <h2 class="section-title">Quick Links</h2>

        <!-- Input row: label field + URL field + Add Link button -->
        <div class="links-input-row">
          <input
            type="text"
            id="link-label-input"
            placeholder="Label (e.g. YouTube)"
            maxlength="30"
          />
          <input
            type="url"
            id="link-url-input"
            placeholder="URL (e.g. https://youtube.com)"
            maxlength="200"
          />
          <button id="add-link-btn">+ Add Link</button>
        </div>

        <!-- Cards for each saved link will appear here.
             JavaScript will build and insert them. -->
        <div id="links-container"></div>
      </section>
      <!-- ============================================================ -->

    </div><!-- end .page-wrapper -->

    <script src="js/app.js"></script>
  </body>
</html>
